[project]
name = "spaik-sdk"
version = "1.0.0rc1"
description = "Python SDK for building AI agents with multi-LLM support, streaming, and production-ready infrastructure"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Siili Solutions Oyj", email = "info@siili.com"}
]
keywords = ["ai", "agents", "llm", "langchain", "openai", "anthropic", "claude", "gpt", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "ag-ui-protocol==1.0.0",
    "langchain>=1.2.0",
    "langchain-core>=1.2.0",
    "langgraph>=1.0.0",
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "anyio>=4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.115.12", "python-multipart>=0.0.18", "uvicorn>=0.33.0"]
openai = ["langchain-openai>=1.1.0"]
anthropic = ["langchain-anthropic>=1.4.6"]
google = ["langchain-google-genai>=4.0.0"]
azure = ["langchain-openai>=1.1.0", "langchain-azure-ai>=1.2.0"]
ollama = ["langchain-ollama>=0.3.0"]
deepseek = ["langchain-deepseek>=1.0.0"]
mistral = ["langchain-mistralai>=0.2.0"]
cohere = ["langchain-cohere>=0.5.0"]
xai = ["langchain-xai>=0.2.0"]
audio = []
mcp = ["langchain[mcp]>=1.4.6"]
dev = ["ruff", "pytest>=7.4.0", "pytest-asyncio>=0.21.1", "pytest-cov>=4.1.0", "pytest-mock>=3.11.1", "pytest-timeout>=2.4.0", "ty==0.0.89"]

[project.urls]
Homepage = "https://github.com/siilisolutions/spaik-sdk"
Repository = "https://github.com/siilisolutions/spaik-sdk"
Documentation = "https://github.com/siilisolutions/spaik-sdk#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spaik_sdk"]
include = ["py.typed"]

[tool.ruff]
line-length = 140
fix = true

[tool.ruff.lint]
# Enable common linters: pyflakes, pycodestyle errors/warnings, isort
select = ["E", "F", "W", "I"]
ignore = ["W293"] # Ignore blank line contains whitespace

[tool.ruff.format]
quote-style = "double" 

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
# Exclude problematic files and manual tests
norecursedirs = ["__pycache__", "*.egg-info", "tests/manual"]
# Better test discovery and output
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--verbose",
    "--tb=short",
    "--cov=spaik_sdk",
    "--cov-report=term-missing",
    "--ignore=__init__.py",
    "--ignore=setup.py",
    "--ignore=tests/manual"
]
# Custom markers for different test types
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, may use external services)",
    "slow: marks tests as slow running",
    "async: marks tests as async tests",
    "timeout: marks tests with custom timeout duration"
]
# Async test configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
    "ruff>=0.13.1",
    "ty==0.0.89",
]
