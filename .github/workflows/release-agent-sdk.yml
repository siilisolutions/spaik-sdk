name: Release agent-sdk

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (ignored while the current version is a release candidate)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Pre-release: publish a release candidate (e.g. 1.0.0rc1). Ticked on an RC gives the next RC; unticked on an RC publishes the final version'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      DEFAULT_MODEL: claude-sonnet-4-20250514
    defaults:
      run:
        working-directory: packages/agent-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        env:
          CURRENT: ${{ steps.current_version.outputs.version }}
          BUMP: ${{ inputs.version_bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(rc|-rc\.)([0-9]+)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            RC="${BASH_REMATCH[3]}"
            echo "::notice::Current version $CURRENT is a release candidate; ignoring bump type $BUMP"
            if [ "$PRERELEASE" = "true" ]; then
              NEW_VERSION="${BASE}rc$((RC + 1))"
            else
              NEW_VERSION="$BASE"
            fi
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
            if [ "$PRERELEASE" = "true" ]; then
              NEW_VERSION="${NEW_VERSION}rc1"
            fi
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping version from $CURRENT to $NEW_VERSION"

      - name: Update version in pyproject.toml and uv.lock
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.new_version.outputs.version }}"/' pyproject.toml
          uv lock

      - name: Run checks
        run: |
          uv run ruff check .
          uv run ty check spaik_sdk tests
          uv run python3 -m pytest tests/unit/ -m "unit" --no-cov

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump spaik-sdk version to ${{ steps.new_version.outputs.version }}"
          git tag "spaik-sdk-v${{ steps.new_version.outputs.version }}"
          git push origin HEAD --tags
