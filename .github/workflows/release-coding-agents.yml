name: Final legacy coding-agent release
on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/coding-agents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Verify final legacy metadata
        run: |
          python -c 'import tomllib; p=tomllib.load(open("pyproject.toml","rb"))["project"]; assert p["version"] == "0.2.3"; assert "spaik-sdk==0.11.1" in p["dependencies"]'
      - name: Install against released legacy SDK
        run: uv sync --no-sources --all-extras
      - name: Validate imports and package
        run: |
          uv run --no-sync python -c 'from spaik_coding_agents import ClaudeAgent, CursorAgent'
          uv build
      - name: Publish final legacy patch
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
      - name: Preserve legacy tag
        run: |
          git tag spaik-coding-agents-v0.2.3
          git push origin spaik-coding-agents-v0.2.3
