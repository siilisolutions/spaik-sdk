name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: oven-sh/setup-bun@v2
      - run: uv python install ${{ matrix.python }}
      - name: Install SDK with optional integrations and development tools
        run: uv sync --python ${{ matrix.python }} --all-extras --dev --locked
        working-directory: packages/agent-sdk
      - name: Python checks and deterministic integration tests
        working-directory: packages/agent-sdk
        run: |
          uv run --no-sync ruff check --no-fix .
          uv run --no-sync ty check spaik_sdk tests
          uv run --no-sync python -m pytest tests --no-cov
      - name: Frontend dependencies
        run: bun install --frozen-lockfile
      - name: Frontend builds and checks
        run: |
          bun run build:packages
          bun run --cwd packages/agent-sdk-hooks lint
          bun run --cwd packages/agent-sdk-hooks type-check
          bun run --cwd packages/agent-sdk-material type-check
          bun run --cwd packages/agent-sdk-material lint
          bun run --cwd examples/frontend build
      - name: Python-to-TypeScript AG-UI contract
        run: |
          packages/agent-sdk/.venv/bin/python scripts/generate_ag_ui_fixture.py
          bun test packages/agent-sdk-hooks/tests
      - name: Browser acceptance tests
        if: matrix.python == '3.13'
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test
      - name: Build SDK wheel
        working-directory: packages/agent-sdk
        run: uv build
      - name: Installed npm artifacts
        if: matrix.python == '3.13'
        run: python scripts/validate_npm_artifacts.py --dist /tmp/spaik-npm-dist
