name: Release spaik-sdk-react

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (ignored while the current version is a release candidate)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Pre-release: publish a release candidate (e.g. 1.0.0-rc.1). Ticked on an RC gives the next RC; unticked on an RC publishes the final version'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get current version
        id: current_version
        working-directory: packages/agent-sdk-hooks
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        env:
          CURRENT: ${{ steps.current_version.outputs.version }}
          BUMP: ${{ inputs.version_bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(rc|-rc\.)([0-9]+)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            RC="${BASH_REMATCH[3]}"
            echo "::notice::Current version $CURRENT is a release candidate; ignoring bump type $BUMP"
            if [ "$PRERELEASE" = "true" ]; then
              NEW_VERSION="${BASE}-rc.$((RC + 1))"
            else
              NEW_VERSION="$BASE"
            fi
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
            if [ "$PRERELEASE" = "true" ]; then
              NEW_VERSION="${NEW_VERSION}-rc.1"
            fi
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping version from $CURRENT to $NEW_VERSION"
          if [ "$PRERELEASE" = "true" ]; then echo "npm_tag=next" >> $GITHUB_OUTPUT; else echo "npm_tag=latest" >> $GITHUB_OUTPUT; fi

      - name: Update version in package.json
        working-directory: packages/agent-sdk-hooks
        run: npm pkg set version=${{ steps.new_version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        working-directory: packages/agent-sdk-hooks
        run: |
          bun run lint
          bun run type-check

      - name: Build package
        working-directory: packages/agent-sdk-hooks
        run: bun run build

      - name: Publish to npm
        working-directory: packages/agent-sdk-hooks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.new_version.outputs.npm_tag }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/agent-sdk-hooks/package.json
          git commit -m "chore: bump spaik-sdk-react version to ${{ steps.new_version.outputs.version }}"
          git tag "spaik-sdk-react-v${{ steps.new_version.outputs.version }}"
          git push origin HEAD --tags
