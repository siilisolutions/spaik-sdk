name: Security Audit

on:
  schedule:
    # Weekly, Monday 06:00 UTC: catches advisories published against unchanged lockfiles
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'bun.lock'
      - '**/package.json'
      - 'packages/agent-sdk/uv.lock'
      - 'packages/agent-sdk/pyproject.toml'
      - '.github/workflows/audit.yml'
  workflow_dispatch:
    inputs:
      fail_on_severity:
        description: 'Minimum severity to fail on (JS only, Python always fails on any vuln)'
        required: false
        default: 'high'
        type: choice
        options:
          - low
          - moderate
          - high
          - critical

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-agent-sdk:
    name: Audit agent-sdk (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --locked
      - name: Install pip-audit
        run: uv pip install pip-audit
      - name: Export requirements and audit
        run: |
          # Audit every shipped extra; filter out local/editable packages (lines starting with . or #)
          uv export --locked --all-extras --no-extra dev --no-dev --no-editable --no-hashes --format requirements-txt 2>/dev/null | grep -E "^[a-zA-Z]" > requirements-audit.txt
          # --disable-pip and --no-deps avoid venv creation issues with uv-installed Python
          uv run python -m pip_audit -r requirements-audit.txt --strict --desc on --progress-spinner off --disable-pip --no-deps

  # bun audit checks the entire monorepo lockfile
  audit-js-packages:
    name: Audit JS packages (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run security audit
        env:
          SEVERITY: ${{ inputs.fail_on_severity || 'high' }}
        run: |
          # Report everything, fail only at or above the threshold
          bun audit || true
          bun audit --audit-level="$SEVERITY" > /dev/null

  # Summary job that depends on all audit jobs
  audit-summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    needs:
      - audit-agent-sdk
      - audit-js-packages
    if: always()
    steps:
      - name: Check audit results
        run: |
          echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each job result
          declare -A results
          results["agent-sdk (Python)"]="${{ needs.audit-agent-sdk.result }}"
          results["JS packages (bun)"]="${{ needs.audit-js-packages.result }}"

          failed=0
          for pkg in "${!results[@]}"; do
            status="${results[$pkg]}"
            if [ "$status" = "success" ]; then
              echo "✅ **$pkg**: Passed" >> $GITHUB_STEP_SUMMARY
            elif [ "$status" = "failure" ]; then
              echo "❌ **$pkg**: Failed - vulnerabilities found" >> $GITHUB_STEP_SUMMARY
              failed=1
            else
              echo "⚠️ **$pkg**: $status" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $failed -eq 1 ]; then
            echo "### ⚠️ Action Required" >> $GITHUB_STEP_SUMMARY
            echo "One or more packages have security vulnerabilities that need to be addressed." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "### ✅ All Clear" >> $GITHUB_STEP_SUMMARY
            echo "No security vulnerabilities found above the configured threshold." >> $GITHUB_STEP_SUMMARY
          fi
