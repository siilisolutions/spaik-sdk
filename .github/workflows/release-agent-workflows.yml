name: Release optional workflows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already committed workflow version, e.g. 0.4.0rc1'
        required: true
        type: string
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Check committed version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c 'import os,tomllib; assert tomllib.load(open("packages/agent-workflows/pyproject.toml","rb"))["project"]["version"] == os.environ["RELEASE_VERSION"]'
      - name: Validate against published SDK without workspace sources
        working-directory: packages/agent-workflows
        run: |
          uv sync --python 3.11 --no-sources --extra dev
          uv run --no-sync ruff check --no-fix agent_workflows
          uv run --no-sync ty check agent_workflows
          uv run --no-sync spaik-agent-workflows --list
      - name: Build and validate installed wheel
        run: |
          uv build --project packages/agent-workflows --out-dir workflow-dist
          uv venv --python 3.11 /tmp/workflow-release-check
          uv pip install --python /tmp/workflow-release-check/bin/python workflow-dist/*.whl
          /tmp/workflow-release-check/bin/spaik-agent-workflows --list
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-release
          path: workflow-dist/*
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish workflow-dist/*
      - name: Tag released source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git tag "spaik-agent-workflows-v$RELEASE_VERSION"
          git push origin "spaik-agent-workflows-v$RELEASE_VERSION"
