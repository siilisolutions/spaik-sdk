name: Final legacy agent-workflows release
on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/agent-workflows
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Verify final legacy metadata
        run: |
          python -c 'import tomllib; p=tomllib.load(open("pyproject.toml","rb"))["project"]; assert p["version"] == "0.3.2"; assert "spaik-sdk==0.11.1" in p["dependencies"]; assert "spaik-coding-agents==0.2.3" in p["dependencies"]'
      - name: Install against released legacy SDK and coding agents
        run: uv sync --no-sources --all-extras
      - name: Validate package
        run: |
          uv run --no-sync ruff check --no-fix agent_workflows
          uv run --no-sync python -m pytest tests
          uv run --no-sync spaik-agent-workflows --list
          uv build
      - name: Publish final legacy patch
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
      - name: Preserve legacy tag
        run: |
          git tag spaik-agent-workflows-v0.3.2
          git push origin spaik-agent-workflows-v0.3.2
