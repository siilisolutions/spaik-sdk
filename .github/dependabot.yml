version: 2
updates:
  # Root bun.lock covers the hooks/material packages and the example app
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      js-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /packages/agent-sdk
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
