[project]
name = "agents-examples"
version = "0.1.0"
description = "Example agents using agent-sdk"
requires-python = ">=3.11"
dependencies = [
    "spaik-sdk[server,openai,anthropic,google,azure,audio,mcp]>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 140
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["W293"]

[tool.ruff.format]
quote-style = "double" 

[tool.uv.sources]
spaik-sdk = { git = "https://github.com/siilisolutions/spaik-sdk.git", subdirectory = "packages/agent-sdk" }
